[project]
name = "miro-fish-engine"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "pypdf>=5,<6",
    "reportlab>=4,<5",
    "openai>=1.50.0",
    "pydantic>=2.8.0",
    "tenacity>=8.5.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
